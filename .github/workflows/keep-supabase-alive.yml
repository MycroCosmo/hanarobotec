name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/notices?select=id&limit=1"
        env:
          # publishable key라 공개되어도 무방 (프론트엔드에 이미 노출됨)
          SUPABASE_URL: https://amseuvowouzqwtdjmjoq.supabase.co
          SUPABASE_KEY: sb_publishable_JbLPO53u1Odu3-1zUj9l7g_FSZTxQmv

      # 저장소가 60일간 커밋이 없으면 GitHub이 스케줄 워크플로우를 비활성화하므로 자동 갱신
      - name: Keep workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2
